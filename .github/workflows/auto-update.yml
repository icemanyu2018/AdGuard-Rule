name: Update Filters
on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
    branches: [ main ]
  schedule:
    - cron: 0 */12 * * *
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

concurrency:
  group: update-filters-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  Update_Filters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build with Maven
        run: mvn -B package

      - name: Run Jar
        run:  java -jar ./target/adg-rule-1.0.0.jar

      - name: Commit rule updates
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- rule)" ]; then
            exit 0
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          git add -- rule
          git config --local user.name "icemanyu2018"
          git config --local user.email "byronyu2004@126.com"
          git commit -m "Update rules: $(date +'%Y-%m-%d %H:%M:%S')" -- rule

      - name: GitHub Push
        if: steps.commit.outputs.status == 'success' && !cancelled()
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Mirror Refresh
        run: sleep 10 && curl 'https://purge.jsdelivr.net/gh/${{github.repository}}/rule'

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 2
