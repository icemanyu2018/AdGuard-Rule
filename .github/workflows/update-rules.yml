name: Update Rules
on:
  push:
    branches: 
      - adrules
    paths-ignore:
      - '*.md'
      - '.DS_Store'
  schedule:
    - cron: '0 */12 * * *'  # 每 12 小时执行一次
  workflow_dispatch:        # 允许手动触发

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

concurrency:
  group: update-rules-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adrules branch
        uses: actions/checkout@v4
        with:
          ref: adrules  # 切换到 adrules 分支

      # 配置 Java 环境（当前仓库为基于 Maven 的 Java 项目）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 构建并运行规则程序
      - name: Build and Run Java Rules Merger
        run: |
          mvn clean compile exec:java

      # 提交构建产物到仓库
      - name: Git push assets to Github
        id: commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update rules: $(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M")"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Push rule updates
        if: steps.commit.outputs.status == 'success' && !cancelled()
        run: git push origin HEAD:adrules

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 2
